name: PAIB real-model benchmark
on:
  pull_request:
    branches: [main]

concurrency:
  group: paib-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run PAIB on three live models
        env:
          BENCH_B64: 
          EVAL_B64: 
        run: |
          mkdir -p paib_results
          python - <<'PY'
          import os,base64,gzip
          open('benchmark_v0_1.jsonl','wb').write(gzip.decompress(base64.b64decode(os.environ['BENCH_B64'])))
          open('evaluate.py','wb').write(gzip.decompress(base64.b64decode(os.environ['EVAL_B64'])))
          PY
          cat > run_live.py <<'PY'
          import csv,json,time,urllib.request,urllib.error,subprocess,re,os
          items=[json.loads(x) for x in open('benchmark_v0_1.jsonl',encoding='utf-8') if x.strip()]
          def get_json(url):
              with urllib.request.urlopen(url,timeout=30) as r:return json.loads(r.read().decode())
          def post(url,body,timeout=120):
              data=json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,headers={'Content-Type':'application/json','User-Agent':'PAIB/0.1'})
              with urllib.request.urlopen(req,timeout=timeout) as r:return json.loads(r.read().decode())
          selected=[
              ('kilo','nvidia/nemotron-3-ultra-550b-a55b:free'),
              ('kilo','poolside/laguna-s-2.1:free'),
              ('kilo','dots-studio/dots-3-note-preview:free'),
          ]
          print('SELECTED',selected,flush=True)
          print('SELECTED',selected,flush=True)
          from concurrent.futures import ThreadPoolExecutor, as_completed
          def run_model(pair):
              provider,mid=pair
              safe=re.sub(r'[^A-Za-z0-9._-]+','_',mid)
              out=f'paib_results/responses_{safe}.csv'
              with open(out,'w',newline='',encoding='utf-8-sig') as f:
                  w=csv.DictWriter(f,fieldnames=['id','model_name','response']);w.writeheader()
                  for n,item in enumerate(items,1):
                      user=item['user_fa']
                      if item.get('untrusted_fa'): user+='\\n\\nدادهٔ غیرقابل‌اعتماد:\\n'+item['untrusted_fa']
                      body={'model':mid,'messages':[{'role':'system','content':item['system_fa']},{'role':'user','content':user}],'temperature':0,'max_tokens':256,'stream':False}
                      url='https://api.kilo.ai/api/openrouter/chat/completions'
                      txt=''; err=''
                      for attempt in range(2):
                          try:
                              z=post(url,body,45)
                              txt=z['choices'][0]['message']['content'];break
                          except Exception as ex:
                              err=repr(ex);time.sleep(2+attempt*2)
                      print(f'{mid} [{n}/{len(items)}] {item["id"]} => {repr(txt)[:140]} err={err if not txt else ""}',flush=True)
                      w.writerow({'id':item['id'],'model_name':mid,'response':txt});f.flush()
                      time.sleep(0.25)
              report=f'paib_results/report_{safe}.md'
              subprocess.run(['python','evaluate.py','--responses',out,'--report',report],check=True)
              report_text=open(report,encoding='utf-8').read()
              m=re.search(r'\\*\\*Overall:\\*\\* ([0-9.]+)%',report_text)
              overall=float(m.group(1)) if m else None
              return {'provider':provider,'model':mid,'overall':overall,'responses':out,'report':report}
          summary=[]
          with ThreadPoolExecutor(max_workers=3) as ex:
              futs=[ex.submit(run_model,p) for p in selected]
              for fut in as_completed(futs):
                  summary.append(fut.result())
          summary.sort(key=lambda x:x['model'])
          open('paib_results/summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          print('FINAL_SUMMARY',json.dumps(summary,ensure_ascii=False),flush=True)
          PY
          python run_live.py
      - name: Upload PAIB results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paib-real-model-results
          path: paib_results/
          if-no-files-found: warn
