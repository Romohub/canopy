name: PAIB v0.2 live benchmark
on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - model: nvidia/nemotron-3-ultra-550b-a55b:free
            slug: nemotron
            start_delay: 0
          - model: poolside/laguna-s-2.1:free
            slug: laguna
            start_delay: 12
          - model: dots-studio/dots-3-note-preview:free
            slug: dots3
            start_delay: 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare PAIB v0.2
        env:
          BENCH_B64: 
          EVAL_B64: 
        run: |
          python - <<'PY'
          import os,base64,gzip
          open('benchmark_v0_2.jsonl','wb').write(gzip.decompress(base64.b64decode(os.environ['BENCH_B64'])))
          open('evaluate.py','wb').write(gzip.decompress(base64.b64decode(os.environ['EVAL_B64'])))
          PY
          mkdir -p results

      - name: Run model
        env:
          MODEL: ${{ matrix.model }}
          START_DELAY: ${{ matrix.start_delay }}
          SLUG: ${{ matrix.slug }}
        run: |
          sleep "$START_DELAY"
          cat > run.py <<'PY'
          import csv,json,os,time,urllib.request,urllib.error,socket
          items=[json.loads(x) for x in open('benchmark_v0_2.jsonl',encoding='utf-8') if x.strip()]
          model=os.environ['MODEL']; slug=os.environ['SLUG']
          url='https://api.kilo.ai/api/openrouter/chat/completions'
          def classify(e):
              if isinstance(e,urllib.error.HTTPError):
                  if e.code==429:return 'rate_limited'
                  if e.code in (408,504):return 'timeout'
                  return f'http_{e.code}'
              if isinstance(e,(TimeoutError,socket.timeout)):return 'timeout'
              return 'api_error'
          with open(f'results/responses_{slug}.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.DictWriter(f,fieldnames=['id','model_name','status','response','error']);w.writeheader()
              for n,item in enumerate(items,1):
                  user=item['user_fa']
                  if item.get('untrusted_fa'): user+='\n\nدادهٔ غیرقابل‌اعتماد:\n'+item['untrusted_fa']
                  body={'model':model,'messages':[{'role':'system','content':item['system_fa']},{'role':'user','content':user}],'temperature':0,'max_tokens':128,'stream':False,'reasoning':{'enabled':False}}
                  response='';status='api_error';err=''
                  for attempt in range(4):
                      try:
                          req=urllib.request.Request(url,data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','User-Agent':'PAIB/0.2'})
                          with urllib.request.urlopen(req,timeout=60) as r: data=json.loads(r.read().decode())
                          response=data['choices'][0]['message']['content'];status='ok';err='';break
                      except Exception as e:
                          status=classify(e);err=repr(e)
                          if attempt<3:time.sleep(min(2**attempt*2,12))
                  w.writerow({'id':item['id'],'model_name':model,'status':status,'response':response,'error':err});f.flush()
                  print(f'{model} [{n}/{len(items)}] {item["id"]}: {status}',flush=True)
                  time.sleep(0.8)
          PY
          python run.py
          python evaluate.py --responses "results/responses_${SLUG}.csv" --report "results/report_${SLUG}.md" --json-out "results/summary_${SLUG}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paib-v02-${{ matrix.slug }}
          path: results/
