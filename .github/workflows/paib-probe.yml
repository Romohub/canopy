name: PAIB endpoint probe
on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Network probe
        run: |
          python - <<'PY'
          import urllib.request
          for u in [
            "https://api.kilo.ai/api/openrouter/models",
            "https://api.murakumo.cloud/v1/models"
          ]:
              try:
                  with urllib.request.urlopen(u, timeout=30) as r:
                      print(u, r.status, r.read(300).decode(errors="replace"))
              except Exception as e:
                  print(u, "ERROR", repr(e))
          PY
